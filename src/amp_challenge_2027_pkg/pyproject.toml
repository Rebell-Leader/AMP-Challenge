[project]
name = "amp-challenge-2027-submission"
version = "1.0.0"
description = "Markov + surrogate-ensemble AMP library generator (AMP Challenge 2027)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "levenshtein>=0.27"]

[project.scripts]
generate_broad_spectrum = "amp_challenge_2027.generate:generate_broad_spectrum"
generate_gram_pos = "amp_challenge_2027.generate:generate_gram_pos"
generate_gram_neg = "amp_challenge_2027.generate:generate_gram_neg"
generate_mdr = "amp_challenge_2027.generate:generate_mdr"
generate_therapeutic = "amp_challenge_2027.generate:generate_therapeutic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_challenge_2027"]
